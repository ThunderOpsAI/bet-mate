[build]
builder = "nixpacks"

[phases.build]
cmds = ["echo 'No build step required for Python'"]

[deploy]
startCommand = "pip install -r requirements.txt && uvicorn app.main:app --host 0.0.0.0 --port ${PORT:-8000}"
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3

[service]
rootDirectory = "/"
